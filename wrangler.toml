name = "outdoor-puzzle"
compatibility_date = "2026-03-24"
main = ".open-next/worker.js"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Use your existing DB binding for D1
[[d1_databases]]
binding = "DB"
database_name = "outdoor_puzzle"
database_id = "99bc2714-eac9-44cc-92d0-ae12cdb69ae9"
migrations_dir = "drizzle"

# R2 bucket for uploading static files (prologue videos, slides, etc)
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "outdoor-puzzle-assets"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1